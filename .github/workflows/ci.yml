name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            package-lock.json

      - name: Backend locked install
        working-directory: backend
        run: uv sync --locked --group dev

      - name: Web locked install
        working-directory: web
        run: npm ci

      - name: E2E runner locked install
        run: npm ci

      # verify now includes browser smoke (e2e/smoke.spec.ts, chromium+firefox)
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Offline gate (check + backend tests + web build + browser smoke)
        run: make verify

      - name: Ensure no credentials in tracked files
        run: |
          if git grep -i -E "BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}" -- . ':!web/package-lock.json' ':!package-lock.json' ':!backend/uv.lock'; then
            echo "possible credential found in tracked files" >&2
            exit 1
          fi
          if git ls-files | grep -x '\.env'; then
            echo ".env must not be tracked" >&2
            exit 1
          fi
