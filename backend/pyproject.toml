[project]
name = "x-insight"
version = "0.1.0"
description = "X-INSIGHT backend (S01 bootstrap)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "pgmpy==1.1.2",
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "lxml==6.1.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x_insight"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
# No local sources in S01.
